<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Trek</title>

<style>
body{
    margin:0;
    padding:0;
    background-image:url("/static/image(7).jpg");
    background-size:cover;
    background-position:center;
}

.fist-box{
    margin-top:50px;
}

.add-trek-box{
    width:950px;
    margin:auto;
    padding:25px;
    border:2px solid black;
    border-radius:20px;
    background-color:#98c0ac;
}

.log{
    text-align:center;
    margin-bottom:30px;
}

/* Form layout */
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:50px;
    row-gap:20px;
}

.fom-iner-content label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
}

.fom-iner-content input{
    width:100%;
    padding:12px;
    border:2px solid black;
    border-radius:5px;
    background-color:#c9dcd1;
    font-size:16px;
    box-sizing:border-box;
}

.log-butn{
    grid-column:1/3;  /* button occupies both columns */
    padding:12px;
    background-color:#2c3e50;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

.reg-butn{
    text-align:center;
    margin-top:20px;
}

.web-info{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="fist-box">
<div class="add-trek-box">

<h2 class="log">Add Your New Trek</h2>

<form method="post">

    <div class="fom-iner-content">
        <label>Route Name</label>
        <input type="text" name="rout_name">
    </div>

    <div class="fom-iner-content">
        <label>Destination</label>
        <input type="text" name="destination">
    </div>

    <div class="fom-iner-content">
        <label>Route Type</label>
        <input type="text" name="rout_type">
    </div>

    <div class="fom-iner-content">
        <label>Difficulty Level</label>
        <input type="number" name="difficulty_level">
    </div>

    <div class="fom-iner-content">
        <label>Total Days</label>
        <input type="number" name="total_days_are">
    </div>

    <div class="fom-iner-content">
        <label>Route Price</label>
        <input type="number" name="rout_price">
    </div>

    <div class="fom-iner-content">
        <label>Capacity</label>
        <input type="number" name="capcity">
    </div>

    <div class="fom-iner-content">
        <label>Remaining Spots</label>
        <input type="number" name="remening_spots">
    </div>

    <div class="fom-iner-content">
        <label>Journey Date</label>
        <input type="date" name="journey_date">
    </div>

    <div class="fom-iner-content">
        <label>Start Location</label>
        <input type="text" name="strt_loction">
    </div>

    <div class="fom-iner-content">
        <label>End Location</label>
        <input type="text" name="end_loction">
    </div>

    <div class="fom-iner-content">
        <label>Distance (km)</label>
        <input type="number" name="distnce">
    </div>

    <div class="fom-iner-content">
        <label>Max Altitude</label>
        <input type="number" name="max_altitdu">
    </div>

    <button type="submit" class="log-butn">Add Trek</button>

</form>

<div class="reg-butn">
    <span>Do not have an account? Click </span>
    <a href="register.html">Register</a>
</div>

<div class="web-info">
    Our site needs account approval before access.<br>
    Thank You!
</div>

</div>
</div>

</body>
</html>
