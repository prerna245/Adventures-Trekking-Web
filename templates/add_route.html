<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Route</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .main-container{
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:230px;
            background:white;
            border-right:1px solid #ddd;
            padding-top:20px;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:40px;
        }

        .sidebar a{
            display:block;
            padding:16px 30px;
            text-decoration:none;
            color:black;
            font-size:17px;
        }

        .sidebar a:hover{
            background:#dbe8ff;
        }

        /* MAIN CONTENT */

        .content{
            flex:1;
            padding:40px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .top-bar h1{
            font-size:32px;
        }

        /* FORM BOX */

        .form-box{
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.08);
        }

        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px 40px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            font-weight:bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:120px;
        }

        .button-box{
            grid-column:1/3;
            display:flex;
            justify-content:flex-end;
            gap:20px;
            margin-top:20px;
        }

        .cancel-btn{
            padding:12px 25px;
            border:1px solid #999;
            background:white;
            border-radius:6px;
            cursor:pointer;
        }

        .save-btn{
            padding:12px 25px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="main-container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>Admin</h2>

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('add_routes') }}">
            Routes
        </a>

        <a href="{{ url_for('manage_staff') }}">
            Staff
        </a>

        <a href="#">
            Users
        </a>

        <a href="#">
            Bookings
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>
    <!-- CONTENT -->
    <div class="content">
        <div class="top-bar">
            <h1>Add New Route</h1>
        </div>
        <div class="form-box">
            <form method="POST">
                <!-- form for the treakking  -->
                <div class="form-group">
                    <label>Route Name</label>
                    <input type="text" name="rout_name">
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" name="destination">
                </div>
                <div class="form-group">
                    <label>Start Trek Date</label>
                    <input type="date" name="strt_trck_date">
                </div>
                <div class="form-group">
                    <label>Difficulty Level</label>
                    <select name="difficulty_level">
                        <option>Easy</option>
                        <option>Moderate</option>
                        <option>Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>End Trek Date</label>
                    <input type="date" name="end_trck_date">
                </div>
                <div class="form-group">
                    <label>Total Days</label>
                    <input type="number" name="total_days_are">
                </div>
                <div class="form-group">
                    <label>Select Staff</label>
                    <select name="staf_ref_id">
                        {% for staf in staff %}
                        <option value="{{ staf.usr_ref_id }}">
                            {{ staf.usrname }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" name="capcity">
                </div>
                <div class="form-group">
                    <label>Remaining Spots</label>
                    <input type="number" name="remening_spots">
                </div>
                <div class="form-group">
                    <label>Route Price</label>
                    <input type="number" name="rout_price">
                </div>
                <div class="form-group">
                    <label>Distance (KM)</label>
                    <input type="number" name="distnce">
                </div>
                <div class="form-group">
                    <label>Route Type</label>
                    <select name="rout_type">
                        <option>Adventure</option>
                        <option>Camping</option>
                        <option>Mountain</option>
                        <option>Forest</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Altitude</label>
                    <input type="number" name="max_altitdu">
                </div>
                <!-- save and cancle buttons -->
                <div class="button-box">
                    <button type="reset" class="cancel-btn">
                        Cancel
                    </button>
                    <button type="submit" class="save-btn">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
