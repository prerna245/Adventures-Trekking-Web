{% extends "base.html" %}
{% block content %}



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <style>
        .fist-box{
            margin-top: 60px;
        }
        body{
            margin: 0;
            padding: 0;
            background-image: url("17221627_rm422-047.jpg");
            background-size: cover;      
            background-position: center;
        }

        .log-form-box {
            width: 400px;
            height: 550px;
            border: 2px solid black;
            border-radius: 20px;
            margin: 20px auto;
            padding: 15px;
            background-color: #98c0ac;
        }

        .log {
            text-align: center;
            text-decoration: double;
            margin-bottom: 25px;
        }

        .fom-iner-content{
            margin-bottom: 20px;
        }

        .fom-iner-content label {
            font-size: 18px;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        .fom-iner-content input {
            width: 350px;
            padding: 12px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: #c9dcd1;
            font-size: 16px;

        }

        .log-butn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .reg-butn {
            margin-top: 22px;
            text-align: center;
            font-size: 20px;
        }
        .web-info{
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
        
    </style>

</head>
<body>
    <div class="fist-box">
        <div class="log-form-box">
            <h2 class="log">Register Form</h2>
            <form method="post">
                <div class="fom-iner-content">
                    <label>First name</h2></label>
                    <input type="text" name="name" placeholder="Enter your first name"required>
                </div>
                <div class="fom-iner-content">
                    <label>Last name</label>
                    <input type="text" name="name" placeholder="Enter your last name" required>
                </div>
                <div class="fom-iner-content">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email id" required>
                </div>
                <div class="fom-iner-content">
                    <label for="password">Enter Password</label>
                    <input type="password" name="password"placeholder="Enter your password" required>
                </div>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="user">User</option>
                    <option value="staff">staff</option>
                </select>
                <button type="submit" class="log-butn">Sign In</button>
            </form>
            <div class="reg-butn">
                <span>Are you already registered ? Nice got to   </span>
                <a href="login.html">Login</a>
            </div>
            <a href="index.html" >Back To Home</a>
            <div class="web-info">
                Our site need account approval before access. <br>Thank You!
            </div>
        </div>
    </div>
</body>
</html>


{% endblock %}
