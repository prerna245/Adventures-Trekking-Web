{% extends "base.html" %}
{% block content %}

    <style>
                *{
                    margin:0;
                    padding:0;
                    box-sizing:border-box;
                    font-family:Arial, sans-serif;
                }
        body{
            background:#939eb3;
        }
        .main-container{
            display:flex;
            min-height:100vh;
        }
        /* Sside bar of admin */
        .sidebar{
            width:240px;
            background:rgb(91, 132, 154);
            border-right:1px solid #ddd;
            padding:20px;
        }
        .sidebar h2{
            font-size:22px;
            font-weight:bold;
            margin-bottom:30px;
            color:#111827;
        }
        .sidebar-elements{
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .sidebar-elements a{
            text-decoration:none;
            padding:14px;
            border-radius:10px;
            color:#0c0e12;
            font-weight:600;
            transition:0.3s;
        }
        .sidebar-elements a:hover{
            background:#12385b;
            color:white;
        }
        .active-link{
            background:#12385b;
            color:white !important;
        }

        /* main above context*/
        .content{
            flex:1;
            padding:40px;
        }
        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }
        /*top head */

        .top-head{
            background:rgb(91, 132, 154);
            padding:18px 25px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            border:1px solid #7d7777;
        }
        .top-head h1{
            font-size:24px;
            color:#111827;
        }
        .name-of-admin{
            font-weight:bold;
            font-size:16px;
            color:#111827;
        }
        .top-bar h1{
            font-size:32px;
        }

        /* box of filled form */
        .form-box{
            background:rgb(48, 105, 116);
            padding:40px;
            border-radius:10px;
        }
        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px 40px;
        }
        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            font-weight:bold;
        }
        .form-group input,
        .form-group select,
        .form-group textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }
        textarea{
            resize:none;
            height:120px;
        }
        .button-box{
            grid-column:1/3;
            display:flex;
            justify-content:flex-end;
            gap:20px;
            margin-top:20px;
        }
        .cancel-butn{
            padding:12px 25px;
            border:1px solid #9d9393;
            background:rgb(205, 200, 200);
            border-radius:6px;
            cursor:pointer;
        }

        .save-butn{
            padding:12px 25px;
            border:none;
            background:#0e4b59;
            color:rgb(10, 9, 9);
            border-radius:6px;
            cursor:pointer;
        }

    </style>

    <div class="main-container">

        <!-- SIDEBAR -->

        <div class="sidebar">

    <h2>Adventure Admin</h2>

    <div class="sidebar-elements">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('add_trek') }}" class="active-link"> Create Treks</a>
            <a href="{{ url_for('manage_staff') }}">Manage Staff</a>
            <a href="{{ url_for('manage_users') }}">Manage Users</a>
            <a href="{{ url_for('manage_trek') }}">Manage Trek</a>
            <a href="{{ url_for('tracking_table') }}">Track Table</a>
            <a href="#">Settings</a>
            <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>
    <!-- context -->
    <div class="content">
        <div class="top-head">
            <h1>Adventrus Trekking Management Application</h1>
            <div class="name-of-admin">
                {{ admin_name }}
            </div>
        </div>

        <div class="top-bar">
            <h1>Add New Route</h1>
        </div>
        <div class="form-box">
            <form method="POST">
                <!-- form for the treakking  -->
                <div class="form-group">
                    <label>Trek Name</label>
                    <input type="text" name="rout_name">
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <input type="text" name="destination">
                </div>
                <div class="form-group">
                    <label>Start Trek Date</label>
                    <input type="date" name="strt_trck_date">
                </div>
                <div class="form-group">
                    <label>Difficulty Level</label>
                    <select name="difficulty_level">
                        <option>Easy</option>
                        <option>Moderate</option>
                        <option>Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>End Trek Date</label>
                    <input type="date" name="end_trck_date">
                </div>
                <div class="form-group">
                    <label>Total Days</label>
                    <input type="number" name="total_days_are">
                </div>
                <div class="form-group">
                    <label>Select Staff</label>
                    <select name="staf_ref_id">
                        {% for staf in staff %}
                        <option value="{{ staf.usr_ref_id }}">
                            {{ staf.usrname }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" name="capcity">
                </div>
                <div class="form-group">
                    <label>Remaining Spots</label>
                    <input type="number" name="remening_spots">
                </div>
                <div class="form-group">
                    <label>Route Price</label>
                    <input type="number" name="rout_price">
                </div>
                <div class="form-group">
                    <label>Distance (KM)</label>
                    <input type="number" name="distnce">
                </div>
                <div class="form-group">
                    <label>Route Type</label>
                    <select name="rout_type">
                        <option>Adventure</option>
                        <option>Camping</option>
                        <option>Mountain</option>
                        <option>Forest</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Altitude</label>
                    <input type="number" name="max_altitdu">
                </div>
                <!-- save and cancle buttons -->
                <div class="button-box">
                    <button type="reset" class="cancel-butn">
                        Cancel
                    </button>
                    <button type="submit" class="save-butn">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
