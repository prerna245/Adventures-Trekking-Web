{% extends "base.html" %}
{% block content %}



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        .fist-box{
            margin-top: 80px;
        }
        body{
            margin: 0;
            padding: 0;
            background-image: url("17221627_rm422-047.jpg");
            background-size: cover;      
            background-position: center;
        }

        .log-form-box {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            border-radius: 20px;
            margin: 20px auto;
            padding: 15px;
            background-color: #98c0ac;;
        }

        .log {
            text-align: center;
            text-decoration: double;
            margin-bottom: 25px;
        }

        .fom-iner-content{
            margin-bottom: 20px;
        }

        .fom-iner-content label {
            font-size: 15px;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        .fom-iner-content input {
            width: 350px;
            padding: 12px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: #c9dcd1;
            font-size: 16px;

        }

        .log-butn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .reg-butn {
            margin-top: 22px;
            text-align: center;
            font-size: 20px;
        }
        .web-info{
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>

</head>
<body>
    <div class="fist-box">
        <div class="log-form-box">
            <h2 class="log">Login Form</h2>
            <form method="post">
                <div class="fom-iner-content">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email id"  required>
                </div>
                <div class="fom-iner-content">
                    <label for="password">Enter Password</label>
                    <input type="password" name="password" placeholder="Enter your password"  required>
                </div>
                <button type="submit" class="log-butn">Sign In</button>
            </form>
            <div class="reg-butn">
                <span>Do not have an account? Click  </span>
                <a href="register.html">Register</a>
            </div>
            <div class="web-info">
                Our site need account approval before access. <br>Thank You!
            </div>
        </div>
    </div>
</body>
</html>


{% endblock %}
